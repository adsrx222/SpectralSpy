name: Compile WASM & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build WASM and Deploy (CloudFlare Workers)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Create dist directory inside server
        run: mkdir -p live-demo/server/dist

      - name: Copy WASM Executable Glue Code
        run: |
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ./live-demo/server/dist/

      - name: Compile Go Server to WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -o ./live-demo/server/dist/main.wasm ./live-demo/server/cmd/main.go

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'live-demo/server'
          command: deploy