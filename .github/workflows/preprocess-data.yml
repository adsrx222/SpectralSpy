name: Pre-process Data

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: 'YouTube Playlist/Album URL'
        required: true
        type: string
        default: 'https://www.youtube.com/playlist?list=PL5A-FXHBxgj3Gfluaje-MuhXC5iBsZF5w'
      skip_processing:
        description: 'Skip download & fingerprinting (Use GitHub Cache)'
        required: false
        type: boolean
        default: false

jobs:
  process-and-upload-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Workspace Cache
        uses: actions/cache/restore@v4
        with:
          path: workspace
          key: workspace-${{ github.event.inputs.album_url }}
          restore-keys: |
            workspace-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r live-demo/data-processing/requirements.txt

      - name: Run download_album.py
        if: ${{ !inputs.skip_processing }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt
          
          python live-demo/data-processing/scripts/download_album.py \
            ./workspace \
            "${{ github.event.inputs.album_url }}" \
            ./live-demo/server/db/schema.sql \
            ./workspace/db.sqlite

      - name: Run process_fingerprints.py
        if: ${{ !inputs.skip_processing }}
        run: |
          python live-demo/data-processing/scripts/process_fingerprints.py \
            -w ./workspace \
            -s ./src/schema.sql \
            -d ./workspace/db.sqlite \
            -m ./cmd/data/main.go

      - name: Save Workspace to Cache
        if: ${{ !inputs.skip_processing }}
        uses: actions/cache/save@v4
        with:
          path: workspace
          key: workspace-${{ github.event.inputs.album_url }}

      - name: Replace Database on Turso
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          # 1. Ensure sqlite3 is installed on the runner
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3
          
          # 2. Convert database to WAL mode and run checkpoint
          echo "Converting SQLite database to WAL mode and checkpointing..."
          sqlite3 ./workspace/db.sqlite "PRAGMA journal_mode=WAL; PRAGMA wal_checkpoint(TRUNCATE);"
          
          # 3. Install Turso CLI
          curl -sL https://get.turso.tech/install.sh | bash
          
          # 4. Update PATH so the shell can find the installed binary automatically
          export PATH="$HOME/.turso/bin:$HOME/.turso:$PATH"
          
          # Print the version to verify it was found correctly
          turso --version
          
          echo "Destroying existing database (if it exists)..."
          turso db destroy --yes spectralspy-db || true
          
          echo "Importing database into Turso..."
          turso db import --name spectralspy-db ./workspace/db.sqlite

      - name: Upload Waveforms and Constellations to Cloudflare R2 (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
        run: |
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="s3://spectralspy"
          
          aws s3 sync ./workspace/waveforms $BUCKET/waveforms \
            --endpoint-url $R2_ENDPOINT
            
          aws s3 sync ./workspace/constellations $BUCKET/constellations \
            --endpoint-url $R2_ENDPOINT