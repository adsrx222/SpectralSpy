name: Pre-process Data

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: 'YouTube Playlist/Album URL'
        required: true
        type: string
        default: 'https://www.youtube.com/playlist?list=PL5A-FXHBxgj3Gfluaje-MuhXC5iBsZF5w'
      skip_processing:
        description: 'Skip download & fingerprinting (Use GitHub Cache)'
        required: false
        type: boolean
        default: false

jobs:
  process-and-upload-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Workspace Cache
        uses: actions/cache/restore@v4
        with:
          path: workspace
          key: workspace-${{ github.event.inputs.album_url }}
          restore-keys: |
            workspace-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r live-demo/data-processing/requirements.txt

      - name: Run download_album.py
        if: ${{ !inputs.skip_processing }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt
          
          python live-demo/data-processing/scripts/download_album.py \
            ./workspace \
            "${{ github.event.inputs.album_url }}" \
            ./live-demo/server/db/schema.sql \
            ./workspace/db.sqlite

      - name: Run process_fingerprints.py
        if: ${{ !inputs.skip_processing }}
        run: |
          python live-demo/data-processing/scripts/process_fingerprints.py \
            -w ./workspace \
            -s ./src/schema.sql \
            -d ./workspace/db.sqlite \
            -m ./cmd/data/main.go

      - name: Save Workspace to Cache
        if: ${{ !inputs.skip_processing }}
        uses: actions/cache/save@v4
        with:
          path: workspace
          key: workspace-${{ github.event.inputs.album_url }}

      - name: Replace Database on Turso (HTTP API)
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          # 1. Ensure sqlite3 and jq are installed
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq
          
          # 2. Convert SQLite database to WAL mode & truncate checkpoint
          echo "Converting SQLite database to WAL mode..."
          sqlite3 ./workspace/db.sqlite "PRAGMA journal_mode=WAL; PRAGMA wal_checkpoint(TRUNCATE);"
          
          # 3. Retrieve your Turso Organization Slug automatically using your API token
          TURSO_ORG=$(curl -s -H "Authorization: Bearer ${TURSO_API_TOKEN}" https://api.turso.tech/v1/organizations | jq -r '.[0].slug')
          echo "Using Turso Organization: ${TURSO_ORG}"

          # 4. Destroy existing database via Platform API (ignore errors if it doesn't exist)
          echo "Destroying existing database..."
          curl -s -X DELETE "https://api.turso.tech/v1/organizations/${TURSO_ORG}/databases/spectralspy-db" \
            -H "Authorization: Bearer ${TURSO_API_TOKEN}" || true

          # 5. Create new database seeded specifically for file upload
          echo "Creating new database seeded for binary upload..."
          curl -s -X POST "https://api.turso.tech/v1/organizations/${TURSO_ORG}/databases" \
            -H "Authorization: Bearer ${TURSO_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "spectralspy-db",
              "group": "default",
              "seed": { "type": "database_upload" }
            }' > /dev/null

          # 6. Generate a temporary database access token
          echo "Minting upload token..."
          DB_TOKEN=$(curl -s -X POST "https://api.turso.tech/v1/organizations/${TURSO_ORG}/databases/spectralspy-db/auth/tokens" \
            -H "Authorization: Bearer ${TURSO_API_TOKEN}" | jq -r '.jwt')

          # 7. Directly upload binary database file
          echo "Uploading binary SQLite file to Turso..."
          curl -s -X POST "https://spectralspy-db-${TURSO_ORG}.turso.io/v1/upload" \
            -H "Authorization: Bearer ${DB_TOKEN}" \
            --data-binary @./workspace/db.sqlite

          echo "Database import successfully completed!"

      - name: Upload Waveforms and Constellations to Cloudflare R2 (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
        run: |
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="s3://spectralspy"
          
          aws s3 sync ./workspace/waveforms $BUCKET/waveforms \
            --endpoint-url $R2_ENDPOINT
            
          aws s3 sync ./workspace/constellations $BUCKET/constellations \
            --endpoint-url $R2_ENDPOINT