name: Pre-process Data

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: 'YouTube Playlist/Album URL'
        required: true
        type: string
        default: 'https://www.youtube.com/playlist?list=PL5A-FXHBxgj3Gfluaje-MuhXC5iBsZF5w'
      skip_processing:
        description: 'Skip download & fingerprinting (Use GitHub Cache)'
        required: false
        type: boolean
        default: false

jobs:
  process-and-upload-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Workspace Cache
        uses: actions/cache/restore@v4
        with:
          path: workspace
          key: workspace-${{ github.event.inputs.album_url }}
          restore-keys: |
            workspace-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r live-demo/data-processing/requirements.txt

      - name: Run download_album.py
        if: ${{ !inputs.skip_processing }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt
          
          python live-demo/data-processing/scripts/download_album.py \
            ./workspace \
            "${{ github.event.inputs.album_url }}" \
            ./live-demo/server/db/schema.sql \
            ./workspace/db.sqlite

      - name: Run process_fingerprints.py
        if: ${{ !inputs.skip_processing }}
        run: |
          python live-demo/data-processing/scripts/process_fingerprints.py \
            -w ./workspace \
            -s ./src/schema.sql \
            -d ./workspace/db.sqlite \
            -m ./cmd/data/main.go

      - name: Save Workspace to Cache
        if: ${{ !inputs.skip_processing }}
        uses: actions/cache/save@v4
        with:
          path: workspace
          key: workspace-${{ github.event.inputs.album_url }}

            - name: Replace Database on Turso
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: adsrx222
          DATABASE_NAME: spectralspy-db
        shell: bash
        run: |
          set -euo pipefail

          DB_FILE="./workspace/db.sqlite"

          echo "==> Checking SQLite database"

          test -f "$DB_FILE" || {
            echo "ERROR: $DB_FILE does not exist"
            exit 1
          }

          echo "==> Preparing SQLite database for Turso"

          sqlite3 "$DB_FILE" <<'SQL'
          PRAGMA journal_mode=WAL;
          PRAGMA wal_checkpoint(TRUNCATE);
          PRAGMA page_size=4096;
          PRAGMA auto_vacuum=0;
          PRAGMA encoding='UTF-8';
          SQL

          echo "==> SQLite database information"
          sqlite3 "$DB_FILE" <<'SQL'
          PRAGMA journal_mode;
          PRAGMA page_size;
          PRAGMA auto_vacuum;
          PRAGMA encoding;
          SELECT name
          FROM sqlite_master
          WHERE type = 'table'
          ORDER BY name;
          SQL

          echo "==> Checking Turso API authentication"

          test -n "$TURSO_API_TOKEN" || {
            echo "ERROR: TURSO_API_TOKEN GitHub secret is empty or missing"
            exit 1
          }

          echo "==> Deleting existing Turso database if it exists"

          DELETE_RESPONSE=$(curl --silent --show-error \
            --write-out "\n%{http_code}" \
            --request DELETE \
            "https://api.turso.tech/v1/organizations/${TURSO_ORG}/databases/${DATABASE_NAME}" \
            --header "Authorization: Bearer ${TURSO_API_TOKEN}")

          DELETE_STATUS=$(echo "$DELETE_RESPONSE" | tail -n1)
          DELETE_BODY=$(echo "$DELETE_RESPONSE" | sed '$d')

          echo "Delete HTTP status: $DELETE_STATUS"

          if [ "$DELETE_STATUS" != "200" ] && [ "$DELETE_STATUS" != "404" ]; then
            echo "ERROR: Failed to delete existing database"
            echo "$DELETE_BODY"
            exit 1
          fi

          echo "==> Creating database configured for SQLite upload"

          CREATE_RESPONSE=$(curl --silent --show-error \
            --write-out "\n%{http_code}" \
            --request POST \
            "https://api.turso.tech/v1/organizations/${TURSO_ORG}/databases" \
            --header "Authorization: Bearer ${TURSO_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"name\": \"${DATABASE_NAME}\",
              \"group\": \"default\",
              \"seed\": {
                \"type\": \"database_upload\"
              }
            }")

          CREATE_STATUS=$(echo "$CREATE_RESPONSE" | tail -n1)
          CREATE_BODY=$(echo "$CREATE_RESPONSE" | sed '$d')

          echo "Create HTTP status: $CREATE_STATUS"
          echo "$CREATE_BODY"

          if [ "$CREATE_STATUS" != "200" ] && [ "$CREATE_STATUS" != "201\" ]; then
            echo "ERROR: Failed to create Turso database"
            exit 1
          fi

          echo "==> Creating database authentication token"

          TOKEN_RESPONSE=$(curl --silent --show-error \
            --write-out "\n%{http_code}" \
            --request POST \
            "https://api.turso.tech/v1/organizations/${TURSO_ORG}/databases/${DATABASE_NAME}/auth/tokens" \
            --header "Authorization: Bearer ${TURSO_API_TOKEN}")

          TOKEN_STATUS=$(echo "$TOKEN_RESPONSE" | tail -n1)
          TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | sed '$d')

          echo "Token HTTP status: $TOKEN_STATUS"

          if [ "$TOKEN_STATUS" != "200" ] && [ "$TOKEN_STATUS" != "201" ]; then
            echo "ERROR: Failed to create database token"
            echo "$TOKEN_BODY"
            exit 1
          fi

          DATABASE_TOKEN=$(echo "$TOKEN_BODY" | jq -r '.jwt_token // .token // empty')

          test -n "$DATABASE_TOKEN" || {
            echo "ERROR: Turso did not return a database token"
            echo "$TOKEN_BODY"
            exit 1
          }

          echo "==> Uploading SQLite database to Turso"

          FILE_SIZE=$(stat -c%s "$DB_FILE")

          UPLOAD_STATUS=$(curl --silent --show-error \
            --write-out "%{http_code}" \
            --request POST \
            "https://${DATABASE_NAME}-${TURSO_ORG}.turso.io/v1/upload" \
            --header "Authorization: Bearer ${DATABASE_TOKEN}" \
            --header "Content-Length: ${FILE_SIZE}" \
            --data-binary "@${DB_FILE}")

          echo ""
          echo "Upload HTTP status: $UPLOAD_STATUS"

          if [ "$UPLOAD_STATUS" != "200" ]; then
            echo "ERROR: Turso database upload failed"
            exit 1
          fi

          echo "==> Turso database upload completed successfully"
         

      - name: Upload Waveforms and Constellations to Cloudflare R2 (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
        run: |
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="s3://spectralspy"
          
          aws s3 sync ./workspace/waveforms $BUCKET/waveforms \
            --endpoint-url $R2_ENDPOINT
            
          aws s3 sync ./workspace/constellations $BUCKET/constellations \
            --endpoint-url $R2_ENDPOINT